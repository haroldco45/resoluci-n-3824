<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Fondo gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a3d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Elemento decorativo superior izquierda -->
  <circle cx="100" cy="80" r="60" fill="#ffd700" opacity="0.1"/>
  <circle cx="150" cy="50" r="40" fill="#ffed4e" opacity="0.15"/>
  
  <!-- Elemento decorativo inferior derecha -->
  <circle cx="1100" cy="550" r="80" fill="#ffd700" opacity="0.08"/>
  <circle cx="1050" cy="600" r="50" fill="#ffed4e" opacity="0.12"/>
  
  <!-- Línea decorativa -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="url(#accentGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Icono minería (pico) -->
  <text x="120" y="120" font-size="100" font-weight="bold">⛏️</text>
  
  <!-- Título principal -->
  <text x="280" y="100" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    Resolución
  </text>
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffd700">
    ANM 3824
  </text>
  
  <!-- Subtítulo -->
  <text x="280" y="250" font-family="Arial, sans-serif" font-size="44" fill="white" opacity="0.95">
    Trazabilidad Minera en Colombia
  </text>
  
  <!-- Divider -->
  <rect x="280" y="280" width="400" height="2" fill="#ffd700"/>
  
  <!-- Descripción breve -->
  <text x="280" y="340" font-family="Arial, sans-serif" font-size="32" fill="white" opacity="0.9">
    Guía completa sobre la implementación
  </text>
  <text x="280" y="380" font-family="Arial, sans-serif" font-size="32" fill="white" opacity="0.9">
    de la trazabilidad en operaciones mineras
  </text>
  
  <!-- Badges -->
  <rect x="280" y="430" width="280" height="50" rx="25" fill="#22c55e" opacity="0.9"/>
  <text x="420" y="465" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    ✓ Vigente desde 2024
  </text>
  
  <!-- Crédito pequeño -->
  <text x="1150" y="610" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.7" text-anchor="end">
    vibraspositivashm.com
  </text>
  
  <!-- Minerales decorativos (esquina inferior) -->
  <g opacity="0.2">
    <circle cx="50" cy="550" r="15" fill="#ffd700"/>
    <circle cx="90" cy="570" r="12" fill="#ffd700"/>
    <circle cx="120" cy="540" r="14" fill="#ffd700"/>
    <circle cx="150" cy="580" r="13" fill="#ffd700"/>
  </g>
</svg>
